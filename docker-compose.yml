version: '3.8'

services:
  app:
    build: .
    container_name: similar-ai-build
    ports:
      - "56600:3000"
    volumes:
      # 映射所有code项目到容器内的/code目录
      - /vol1/1000/code:/code:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PROXY_URL=http://192.168.9.2:1082
    restart: unless-stopped
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  1panel-network:
    external: true
